<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AL/GA Data Center Project Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --proposed: #2ecc40;
    --consideration: #3498db;
    --approved: #ff9800;
    --construction: #e74c3c;
    --completed: #8e44ad;
    --stopped: #999;
    --bg: #f5f6fa;
    --card-bg: #fff;
    --text: #222;
    --text-muted: #666;
    --border: #ddd;
    --badge-text: #fff;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }

  header { padding: 16px; background: #1a1a2e; color: #fff; }
  header h1 { font-size: 1.25rem; }

  #controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: var(--card-bg); border-bottom: 1px solid var(--border); align-items: center; }
  #controls label { font-size: 0.85rem; font-weight: 600; }
  #controls select, #controls button { font-size: 0.8rem; padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px; background: #fff; cursor: pointer; }
  #controls button.active { background: #1a1a2e; color: #fff; }

  #map { width: 100%; height: 55vh; min-height: 320px; }

  .legend { position: absolute; bottom: 24px; right: 16px; background: rgba(255,255,255,.92); padding: 10px 14px; border-radius: 6px; font-size: 0.78rem; z-index: 1000; box-shadow: 0 1px 4px rgba(0,0,0,.15); line-height: 1.7; }
  .legend-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

  #detail { display: none; max-width: 900px; margin: 16px auto; padding: 20px 24px; background: var(--card-bg); border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.08); }
  #detail.open { display: block; }
  #detail h2 { font-size: 1.15rem; margin-bottom: 2px; }
  #detail .developer { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 8px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; color: var(--badge-text); text-transform: uppercase; letter-spacing: .4px; }
  .badge-proposed       { background: var(--proposed); }
  .badge-consideration  { background: var(--consideration); }
  .badge-approved       { background: var(--approved); }
  .badge-construction   { background: var(--construction); }
  .badge-completed      { background: var(--completed); }
  .badge-stopped        { background: var(--stopped); }
  #detail .meta { margin: 10px 0; font-size: 0.9rem; color: var(--text-muted); }
  #detail .meta span { margin-right: 18px; }
  #detail .regulatory { margin: 12px 0; line-height: 1.6; font-size: 0.92rem; }

  #detail h3 { font-size: 0.95rem; margin: 16px 0 6px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }

  .sources-list { list-style: none; padding-left: 0; }
  .sources-list li { padding: 4px 0; font-size: 0.88rem; }
  .sources-list a { color: #2563eb; text-decoration: none; word-break: break-all; }
  .sources-list a:hover { text-decoration: underline; }

  #no-detail { text-align: center; padding: 32px 16px; color: var(--text-muted); font-size: 0.95rem; }

  @media (max-width: 600px) {
    #map { height: 45vh; }
    #detail { margin: 10px; padding: 14px; }
    #controls { padding: 8px 10px; }
  }
</style>
</head>
<body>

<header><h1>AL / GA Data Center Project Map</h1></header>

<div id="controls">
  <label>State:</label>
  <select id="stateFilter">
    <option value="all">Both</option>
    <option value="AL">Alabama</option>
    <option value="GA">Georgia</option>
  </select>
  <label>Stage:</label>
  <button class="stage-btn active" data-stage="all">All</button>
  <button class="stage-btn" data-stage="proposed">Proposed</button>
  <button class="stage-btn" data-stage="consideration">Under Consideration</button>
  <button class="stage-btn" data-stage="approved">Approved</button>
  <button class="stage-btn" data-stage="construction">Construction</button>
  <button class="stage-btn" data-stage="completed">Completed</button>
  <button class="stage-btn" data-stage="stopped">Stopped</button>
</div>

<div id="map"></div>

<div id="no-detail">Click a marker on the map to see project details.</div>
<div id="detail"></div>

<footer style="text-align:center;padding:16px;font-size:0.8rem;color:#888;">
  Data from <a href="https://www.compute-atlas.com" style="color:#2563eb;">Compute Atlas</a> by Edward Kubiak (<a href="https://creativecommons.org/licenses/by/4.0/" style="color:#2563eb;">CC BY 4.0</a>) and original research.
</footer>

<script>
const STAGE_MAP = {
  'Proposed': 'proposed',
  'Under Consideration': 'consideration',
  'Approved, Not Built': 'approved',
  'Construction in Progress': 'construction',
  'Completed': 'completed',
  'Stopped or Paused': 'stopped'
};

const STAGE_COLOR = {
  proposed: '#2ecc40',
  consideration: '#3498db',
  approved: '#ff9800',
  construction: '#e74c3c',
  completed: '#8e44ad',
  stopped: '#999'
};

const STAGE_LABEL = {
  proposed: 'Proposed',
  consideration: 'Under Consideration',
  approved: 'Approved, Not Built',
  construction: 'Construction in Progress',
  completed: 'Completed',
  stopped: 'Stopped / Paused'
};

function markerIcon(color) {
  return L.divIcon({
    className: '',
    html: `<svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="${color}" stroke="#fff" stroke-width="1.5"/></svg>`,
    iconSize: [14, 14],
    iconAnchor: [7, 7]
  });
}

let map, markers = [], facilities = [];

function initMap() {
  map = L.map('map').setView([33.0, -85.5], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 18
  }).addTo(map);

  const legend = L.control({ position: 'bottomright' });
  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML = Object.entries(STAGE_COLOR).map(([key, color]) =>
      `<div><span class="legend-dot" style="background:${color}"></span>${STAGE_LABEL[key]}</div>`
    ).join('');
    return div;
  };
  legend.addTo(map);
}

function renderMarkers() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  const stateVal = document.getElementById('stateFilter').value;
  const stageBtn = document.querySelector('.stage-btn.active');
  const stageVal = stageBtn ? stageBtn.dataset.stage : 'all';

  facilities.forEach(f => {
    const mapped = STAGE_MAP[f.stage] || 'stopped';
    if (!f.lat || !f.lon) return;
    if (stateVal !== 'all' && f.state !== stateVal) return;
    if (stageVal !== 'all' && mapped !== stageVal) return;

    const color = STAGE_COLOR[mapped] || '#999';
    const m = L.marker([f.lat, f.lon], { icon: markerIcon(color) });
    m.on('click', () => showDetail(f));
    m.addTo(map);
    markers.push(m);
  });
}

function showDetail(f) {
  const mapped = STAGE_MAP[f.stage] || 'stopped';
  const el = document.getElementById('detail');
  document.getElementById('no-detail').style.display = 'none';

  let metaHtml = `<span>${escHtml(f.cityCounty)}, ${escHtml(f.state)}</span>`;

  let regHtml = '';
  if (f.regulatoryBody) {
    regHtml = `<h3>Regulatory Body</h3><p class="regulatory">${escHtml(f.regulatoryBody)}</p>`;
  }

  let sourcesHtml = '';
  if (f.sources && f.sources.length) {
    sourcesHtml = '<h3>Related News</h3><ul class="sources-list">' +
      f.sources.map(s => {
        const domain = s.url.replace(/^https?:\/\//, '').replace(/\/.*/, '');
        return `<li><a href="${escAttr(s.url)}" target="_blank" rel="noopener">${escHtml(s.label || domain)}</a></li>`;
      }).join('') + '</ul>';
  }

  el.innerHTML =
    `<h2>${escHtml(f.name)}</h2>` +
    (f.developer ? `<div class="developer">${escHtml(f.developer)}</div>` : '') +
    `<span class="badge badge-${mapped}">${STAGE_LABEL[mapped]}</span>` +
    `<div class="meta">${metaHtml}</div>` +
    regHtml +
    sourcesHtml;

  el.classList.add('open');
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function escAttr(s) {
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('stateFilter').addEventListener('change', renderMarkers);

document.querySelectorAll('.stage-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.stage-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderMarkers();
  });
});

fetch('data/dcw-facilities.json')
  .then(r => r.json())
  .then(data => {
    facilities = data;
    initMap();
    renderMarkers();
  });
</script>
</body>
</html>
